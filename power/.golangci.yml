version: "2"

run:
  allow-parallel-runners: true
  relative-path-mode: cfg

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errorlint
    - gosec
    - intrange
    - misspell
    - modernize
    - nolintlint
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    depguard:
      rules:
        apps:
          deny:
            - pkg: github.com/stubbedev/lys/login
              desc: apps share code through desktop/ or lib/, never through another app
            - pkg: github.com/stubbedev/lys/polkit
              desc: apps share code through desktop/ or lib/, never through another app
            - pkg: github.com/stubbedev/lys/secrets
              desc: apps share code through desktop/ or lib/, never through another app
            - pkg: github.com/stubbedev/lys/settings
              desc: apps share code through desktop/ or lib/, never through another app
            - pkg: github.com/stubbedev/lys/shell
              desc: apps share code through desktop/ or lib/, never through another app
            - pkg: github.com/stubbedev/lys/splash
              desc: apps share code through desktop/ or lib/, never through another app
            - pkg: github.com/stubbedev/lys/wm
              desc: apps share code through desktop/ or lib/, never through another app
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        # sysfs, state and runtime paths come from the configuration by design.
        - G304
        - G703
    perfsprint:
      strconcat: true
      sprintf1: true
    revive:
      rules:
        # Stub doc comments are noise; package docs carry the context.
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/stubbedev/lys/power)
  exclusions:
    generated: lax
