<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="dev.stubbe.lys.Nap1"/>
  </policy>
  <policy context="default">
    <allow send_destination="dev.stubbe.lys.Nap1" send_interface="dev.stubbe.lys.Nap1" send_member="SetTimerSlack"/>
    <allow send_destination="dev.stubbe.lys.Nap1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
