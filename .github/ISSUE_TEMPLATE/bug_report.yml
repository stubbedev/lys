name: Bug Report
description: Report a bug in lys.
type: Bug
body:
    - type: checkboxes
      attributes:
          label: Quick check
          options:
              - label: I searched existing issues first.
                required: true

    - type: textarea
      id: description
      attributes:
          label: Description
      validations:
          required: true

    - type: textarea
      id: repro
      attributes:
          label: Steps to reproduce
          placeholder: |
              1.
              2.
              3.
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
      validations:
          required: true

    - type: input
      id: lys-version
      attributes:
          label: lys version
          description: "`lys --version`"
          placeholder: "0.1.0"
      validations:
          required: true

    - type: input
      id: distro
      attributes:
          label: Distro
          placeholder: "Arch Linux, Fedora 41, Ubuntu 24.04, NixOS 24.11, etc."
      validations:
          required: true

    - type: input
      id: compositor
      attributes:
          label: Compositor and version
          placeholder: "Hyprland 0.45.0, Sway 1.10, etc."
      validations:
          required: true

    - type: input
      id: display-setup
      attributes:
          label: Display setup
          description: Monitor count, resolution, and scale.
          placeholder: "1x 2560x1440 @ scale 1, dual 1920x1080 @ scale 1, etc."
      validations:
          required: false

    - type: textarea
      id: config
      attributes:
          label: Relevant config
          description: The relevant section of `~/.config/lys/config.yaml`, if applicable.
          render: yaml
      validations:
          required: false

    - type: textarea
      id: logs
      attributes:
          label: Logs
          description: Run with `RUST_LOG=debug lys shell` for verbose output.
          render: shell
      validations:
          required: false

    - type: dropdown
      id: area
      attributes:
          label: Affected area
          options:
              - "Shell: bar, dropdowns, notifications, OSD, launcher"
              - Compositor (lys-wm)
              - "Login, greeter or lock screen (lys-login)"
              - Settings app (lys-settings)
              - "Polkit agent (lys-polkit)"
              - "Battery and power profiles (lys-power)"
              - Secret Service and vault (lys-secrets)
              - "Boot splash (lys-splash)"
              - UI toolkit (lys-ui)
              - "Libraries (lys-lib, lys-desktop)"
              - Packages and install
              - "Documentation"
              - Not sure
      validations:
          required: true
