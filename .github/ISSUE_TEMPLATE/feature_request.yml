name: Feature Request
description: Suggest something new or a change to existing behavior.
type: Feature
body:
    - type: checkboxes
      attributes:
          label: Quick check
          options:
              - label: I searched existing issues first.
                required: true

    - type: textarea
      id: problem
      attributes:
          label: Problem or use case
          description: What are you trying to do?
      validations:
          required: true

    - type: textarea
      id: solution
      attributes:
          label: Proposed solution
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
      validations:
          required: false

    - type: dropdown
      id: area
      attributes:
          label: Related area
          options:
              - "Shell: bar, dropdowns, notifications, OSD, launcher"
              - Compositor (lys-wm)
              - "Login, greeter or lock screen (lys-login)"
              - Settings app (lys-settings)
              - "Polkit agent (lys-polkit)"
              - Secret Service and vault (lys-secrets)
              - "Boot splash (lys-splash)"
              - UI toolkit (lys-ui)
              - "Libraries (lys-lib, lys-desktop)"
              - Packages and install
              - "Documentation"
              - Not sure
      validations:
          required: false
