name: Save the Go build cache
description: >-
  Saves the Go build cache ./.github/actions/setup restored, with only the
  build and lint cache entries this job used: setup dated every restored entry
  two hours back, Go and golangci-lint date an entry they use to now when it is
  over an hour old, so an entry still older than 90 minutes went unused and is
  dropped before the save. The module cache is saved whole. Once saved, the
  job's older entries on this ref are deleted: each job keeps one, so the
  repository's caches stay under the 10 GB GitHub keeps, past which it evicts
  whole entries and jobs start cold. The calling workflow grants actions:
  write for that.

inputs:
  path:
    description: The setup action's go-cache-path output.
    required: true
  marked:
    description: The setup action's go-cache-marked output.
    required: true
  key:
    description: The setup action's go-cache-key output.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        MARKED: ${{ inputs.marked }}
      run: |
        while IFS= read -r dir; do
          if [ -d "$dir" ]; then
            before=$(du -sm "$dir" | cut -f1)
            find "$dir" -mindepth 2 -type f -mmin +90 -delete
            echo "${dir}: ${before} MB restored and built, $(du -sm "$dir" | cut -f1) MB used and saved"
          fi
        done <<< "$MARKED"

    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}

    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        KEY: ${{ inputs.key }}
      run: |
        set -euo pipefail
        export PREFIX="${KEY%-*-*}-"
        mapfile -t older < <(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100&ref=${GITHUB_REF}&key=${PREFIX}" --jq '.actions_caches[] | select(.key != env.KEY and (.key | ltrimstr(env.PREFIX) | test("^[0-9]+-[0-9]+$"))) | "\(.id) \(.key)"')
        for entry in "${older[@]}"; do
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${entry%% *}" >/dev/null
          echo "deleted the older cache entry ${entry#* }"
        done
