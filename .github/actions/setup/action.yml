name: Nix, caches and the runner's switches
description: >-
  Installs Nix with the xilo substituters, just and jq. A job after the build
  stage sets substitute-only: its Nix then only substitutes (max-jobs = 0), so
  anything the build jobs did not build and push fails the job instead of
  building again. Restores the newest Go build cache the job saved in an
  earlier run, and gives the runner KVM, unprivileged user namespaces or free
  disk when the job asks. A job that compiles Go gets /dev/udmabuf, the only
  dmabuf a runner without a GPU has: lavapipe exports and imports through it,
  and test clients allocate from it. The runners' azure kernels build udmabuf
  in (CONFIG_UDMABUF=y), so the node exists and only needs opening to the
  runner's user.
  The job saves the Go build cache itself, with ./.github/actions/go-cache-save
  on the go-cache-path, go-cache-marked and go-cache-key outputs under
  if: always() && go-cache-save, so a job that failed or timed out still leaves
  its compiled packages to the next run. Every run saves under a key of its
  own, so the next run starts from this one's cache rather than from the first
  of the day, and saves only the entries this job used: the restore dates every
  build and lint cache entry two hours back, Go and golangci-lint date an entry
  they use to now when it is over an hour old, and the save drops what is still
  older than 90 minutes. Go reuses a test result only while nothing it depends
  on changed; the weekly scheduled run reruns everything.

inputs:
  github-token:
    description: Token for the Nix fetches GitHub rate-limits.
    required: true
  go-cache:
    description: The job's own Go build cache key; empty for a job that compiles no Go.
    default: ""
  substitute-only:
    description: Let Nix only substitute, for a job that runs on the build stage's outputs.
    default: "false"
  kvm:
    description: Give the runner KVM, for NixOS VM checks.
    default: "false"
  userns:
    description: Allow unprivileged user namespaces, which lib/gpu's udmabuf test enters with unshare.
    default: "false"
  free-disk:
    description: Remove the runner's preinstalled toolchains, for a build job that writes disk images.
    default: "false"

outputs:
  go-cache-path:
    description: The directories the Go build cache holds.
    value: ${{ steps.go-cache-path.outputs.path }}
  go-cache-marked:
    description: The directories of go-cache-path whose entries Go and golangci-lint date when they use them.
    value: ${{ steps.go-cache-path.outputs.marked }}
  go-cache-key:
    description: The key to save the Go build cache under.
    value: ${{ steps.go-cache.outputs.cache-primary-key }}
  go-cache-save:
    description: Whether the job is to save the Go build cache, "true" unless it restored that exact key.
    value: ${{ inputs.go-cache != '' && steps.go-cache.outputs.cache-hit != 'true' }}

runs:
  using: composite
  steps:
    - if: inputs.free-disk == 'true'
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

    - if: inputs.kvm == 'true'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - if: inputs.go-cache != ''
      shell: bash
      run: |
        if [[ ! -c /dev/udmabuf ]]; then
          echo "setup: $(uname -r) has no /dev/udmabuf" >&2
          exit 1
        fi
        sudo chmod 0666 /dev/udmabuf

    - if: inputs.userns == 'true'
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      with:
        github_access_token: ${{ inputs.github-token }}
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true
          always-allow-substitutes = true
          max-jobs = ${{ inputs.substitute-only == 'true' && '0' || 'auto' }}

    - uses: stubbedev/xilo@b48c60917a4472a527f463995ad62e9ea0addf18 # v2.0.0
      with:
        url: https://xilos.dev
        cache: stubbedev/main
        push: "false"

    - name: just and jq, from the flake's nixpkgs
      shell: bash
      run: |
        nix build --inputs-from . --no-link --print-out-paths nixpkgs#just nixpkgs#jq^bin | sed 's|$|/bin|' >> "$GITHUB_PATH"

    - if: inputs.go-cache != ''
      id: go-cache-path
      shell: bash
      run: |
        marked=(~/.cache/go-build ~/.cache/golangci-lint)
        {
          echo 'path<<EOF'
          printf '%s\n' "${marked[@]}" ~/go/pkg/mod
          echo EOF
          echo 'marked<<EOF'
          printf '%s\n' "${marked[@]}"
          echo EOF
        } >> "$GITHUB_OUTPUT"

    - if: inputs.go-cache != ''
      id: go-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go-cache-path.outputs.path }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ inputs.go-cache }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ inputs.go-cache }}-

    - if: steps.go-cache.outputs.cache-matched-key != ''
      shell: bash
      env:
        MARKED: ${{ steps.go-cache-path.outputs.marked }}
      run: |
        while IFS= read -r dir; do
          if [ -d "$dir" ]; then
            find "$dir" -mindepth 2 -type f -exec touch -m -d '2 hours ago' {} +
          fi
        done <<< "$MARKED"

    - name: Reuse unchanged test results, apart from the weekly full run
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
      run: |
        if [ "$EVENT" = schedule ]; then
          echo "GOFLAGS=-count=1" >> "$GITHUB_ENV"
        else
          echo "LYS_TEST_ARGS=" >> "$GITHUB_ENV"
        fi
