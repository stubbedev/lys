name: "security"

on:
  pull_request:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    uses: stubbedev/lys-ci/.github/workflows/security.yml@ef230c6c7cb569cac3cb55dc727a45d496f727d4
    with:
      bounded-timeouts: true
