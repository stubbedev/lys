name: "security"

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    uses: stubbedev/lys-ci/.github/workflows/security.yml@ef230c6c7cb569cac3cb55dc727a45d496f727d4
    with:
      bounded-timeouts: true
