name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      components: ${{ steps.plan.outputs.components }}
      shells: ${{ steps.plan.outputs.shells }}
      builds: ${{ steps.plan.outputs.builds }}
      jobs: ${{ steps.plan.outputs.jobs }}
      build-jobs: ${{ steps.plan.outputs.build-jobs }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) go run ./ci/affected -github -base "$PR_BASE" ;;
            push) go run ./ci/affected -github -base "$PUSH_BASE" ;;
            *) go run ./ci/affected -github -all ;;
          esac
      - name: Summary
        env:
          COMPONENTS: ${{ steps.plan.outputs.components }}
          PACKAGES: ${{ steps.plan.outputs.packages }}
        run: |
          printf 'Components: %s\n\nPackages: %s\n' "$COMPONENTS" "$PACKAGES" >> "$GITHUB_STEP_SUMMARY"

  shells:
    needs: plan
    if: needs.plan.outputs.shells != '[]'
    uses: ./.github/workflows/build.yml
    with:
      matrix: ${{ needs.plan.outputs.shells }}
    secrets:
      XILO_TOKEN: ${{ secrets.XILO_TOKEN }}

  build:
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    uses: ./.github/workflows/build.yml
    with:
      matrix: ${{ needs.plan.outputs.builds }}
    secrets:
      XILO_TOKEN: ${{ secrets.XILO_TOKEN }}

  build-job:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.build-jobs != '[]' && needs.build.result != 'failure' }}
    uses: ./.github/workflows/run.yml
    with:
      matrix: ${{ needs.plan.outputs.build-jobs }}

  job:
    needs: [plan, shells]
    if: ${{ !cancelled() && needs.plan.outputs.jobs != '[]' && needs.shells.result != 'failure' }}
    uses: ./.github/workflows/run.yml
    with:
      matrix: ${{ needs.plan.outputs.jobs }}

  package:
    needs: [plan, shells]
    if: ${{ !cancelled() && needs.plan.outputs.packages != '[]' && needs.shells.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.packages) }}
    uses: ./.github/workflows/package.yml
    with:
      component: ${{ matrix.component }}
      version: 0~git${{ github.sha }}
      arches: '[{"runner": "ubuntu-latest", "arch": "x86_64", "deb": "amd64"}]'
      substitute-only: true

  ci:
    needs: [plan, shells, build, build-job, job, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every planned job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "a planned job ended $result"; exit 1 ;;
            esac
          done
