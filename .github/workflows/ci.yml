name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      components: ${{ steps.plan.outputs.components }}
      shells: ${{ steps.plan.outputs.shells }}
      builds: ${{ steps.plan.outputs.builds }}
      jobs: ${{ steps.plan.outputs.jobs }}
      lanes: ${{ steps.plan.outputs.lanes }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod/cache/download
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          lookup-only: true
      - name: Download every module once for the Go jobs, which restore them
        if: steps.modules.outputs.cache-hit != 'true'
        run: go mod download
      - if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod/cache/download
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - name: Delete the modules of an older go.sum
        if: steps.modules.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.modules.outputs.cache-primary-key }}
        run: .github/actions/go-cache-save/supersede "$KEY" "gomod-${RUNNER_OS}-" '^[0-9a-f]+$'
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) go run ./ci/affected -github -base "$PR_BASE" ;;
            push) go run ./ci/affected -github -base "$PUSH_BASE" ;;
            *) go run ./ci/affected -github -all ;;
          esac
      - name: Summary
        env:
          COMPONENTS: ${{ steps.plan.outputs.components }}
          PACKAGES: ${{ steps.plan.outputs.packages }}
        run: |
          printf 'Components: %s\n\nPackages: %s\n' "$COMPONENTS" "$PACKAGES" >> "$GITHUB_STEP_SUMMARY"

  shells:
    needs: plan
    if: needs.plan.outputs.shells != '[]'
    uses: ./.github/workflows/build.yml
    with:
      matrix: ${{ needs.plan.outputs.shells }}
    secrets:
      XILO_TOKEN: ${{ secrets.XILO_TOKEN }}

  build:
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    uses: ./.github/workflows/build.yml
    with:
      matrix: ${{ needs.plan.outputs.builds }}
    secrets:
      XILO_TOKEN: ${{ secrets.XILO_TOKEN }}

  lane:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.lanes != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.lanes) }}
    uses: ./.github/workflows/lane.yml
    with:
      build: ${{ toJSON(matrix.build) }}
      jobs: ${{ toJSON(matrix.jobs) }}
    secrets:
      XILO_TOKEN: ${{ secrets.XILO_TOKEN }}

  job:
    needs: [plan, shells]
    if: ${{ !cancelled() && needs.plan.outputs.jobs != '[]' && needs.shells.result != 'failure' }}
    uses: ./.github/workflows/run.yml
    with:
      matrix: ${{ needs.plan.outputs.jobs }}

  package:
    needs: [plan, shells]
    if: ${{ !cancelled() && needs.plan.outputs.packages != '[]' && needs.shells.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.packages) }}
    uses: ./.github/workflows/package.yml
    with:
      component: ${{ matrix.component }}
      version: 0~git${{ github.sha }}
      arches: '[{"runner": "ubuntu-latest", "arch": "x86_64", "deb": "amd64"}]'
      substitute-only: true

  ci:
    needs: [plan, shells, build, lane, job, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every planned job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "a planned job ended $result"; exit 1 ;;
            esac
          done
