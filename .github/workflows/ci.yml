name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      components: ${{ steps.plan.outputs.components }}
      builds: ${{ steps.plan.outputs.builds }}
      jobs: ${{ steps.plan.outputs.jobs }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) go run ./ci/affected -github -base "$PR_BASE" ;;
            push) go run ./ci/affected -github -base "$PUSH_BASE" ;;
            *) go run ./ci/affected -github -all ;;
          esac
      - name: Summary
        env:
          COMPONENTS: ${{ steps.plan.outputs.components }}
          PACKAGES: ${{ steps.plan.outputs.packages }}
        run: |
          printf 'Components: %s\n\nPackages: %s\n' "$COMPONENTS" "$PACKAGES" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      XILO_TOKEN: ${{ secrets.XILO_TOKEN }}
    steps:
      - name: The binary cache token the later jobs substitute through
        run: |
          if [ -z "$XILO_TOKEN" ]; then
            echo "::error::XILO_TOKEN is not set, so the build job cannot push what it builds and every later job would have to build it again; set it as an Actions secret, and as a Dependabot secret for Dependabot's pull requests"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          free-disk: ${{ matrix.free-disk }}
      - uses: stubbedev/xilo@dd96cb09f7781ceccd534af338a36853c80f7193 # v1.2.6
        with:
          url: https://nix.stubbe.dev
          cache: default/default
          token: ${{ secrets.XILO_TOKEN }}
      - id: store
        name: The store before the build
        run: ls /nix/store > "${RUNNER_TEMP}/store"
      - name: The component's packages, checks, dev shell and VM closures
        timeout-minutes: 6
        run: ${{ matrix.run }}
      - name: Push what the build built or substituted, also after it failed or timed out
        if: always() && steps.store.outcome == 'success'
        timeout-minutes: 2
        run: just new-store-paths "${RUNNER_TEMP}/store" | xilo push default/default -

  job:
    needs: [plan, build]
    if: needs.plan.outputs.jobs != '[]'
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          go-cache: ${{ !matrix.kvm && matrix.id || '' }}
          substitute-only: true
          kvm: ${{ matrix.kvm }}
          userns: ${{ matrix.userns }}
          free-disk: ${{ matrix.free-disk }}
      - run: ${{ matrix.run }}
      - name: Save the Go build cache, also after a failure or the timeout
        if: always() && steps.setup.outputs.go-cache-save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.go-cache-path }}
          key: ${{ steps.setup.outputs.go-cache-key }}

  package:
    needs: [plan, build]
    if: needs.plan.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.packages) }}
    uses: ./.github/workflows/package.yml
    with:
      component: ${{ matrix.component }}
      version: 0~git${{ github.sha }}
      arches: '[{"runner": "ubuntu-latest", "arch": "x86_64", "deb": "amd64"}]'
      substitute-only: true

  ci:
    needs: [plan, build, job, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every planned job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "a planned job ended $result"; exit 1 ;;
            esac
          done
