name: build

# A CI build stage: one job per entry of the matrix the plan job wrote, each
# building its entry's Nix outputs and pushing to the binary cache everything
# that appeared in the store, also when the build failed or timed out.

on:
  workflow_call:
    inputs:
      matrix:
        description: The plan's build entries, as JSON.
        required: true
        type: string
    secrets:
      XILO_TOKEN:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      XILO_TOKEN: ${{ secrets.XILO_TOKEN }}
    steps:
      - name: The binary cache token the later jobs substitute through
        run: |
          if [ -z "$XILO_TOKEN" ]; then
            echo "::error::XILO_TOKEN is not set, so the build job cannot push what it builds and every later job would have to build it again; set it as an Actions secret, and as a Dependabot secret for Dependabot's pull requests"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Disk space before setup
        run: df -BM --output=target,size,used,avail /
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          free-disk: ${{ matrix.free-disk }}
      - name: Disk space after setup
        run: df -BM --output=target,size,used,avail /
      - uses: stubbedev/xilo@b48c60917a4472a527f463995ad62e9ea0addf18 # v2.0.0
        with:
          url: https://xilos.dev
          cache: stubbedev/main
          token: ${{ secrets.XILO_TOKEN }}
          push-timeout-minutes: 3
      - name: The entry's Nix outputs
        timeout-minutes: 6
        run: ${{ matrix.run }}
      - name: Disk space after the build
        run: df -BM --output=target,size,used,avail /
