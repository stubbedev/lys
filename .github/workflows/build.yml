name: build

# A CI build stage: one job per entry of the matrix the plan job wrote, each
# building its entry's Nix outputs and pushing to the binary cache everything
# that appeared in the store, also when the build failed or timed out.

on:
  workflow_call:
    inputs:
      matrix:
        description: The plan's build entries, as JSON.
        required: true
        type: string
    secrets:
      XILO_TOKEN:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      XILO_TOKEN: ${{ secrets.XILO_TOKEN }}
    steps:
      - name: The binary cache token the later jobs substitute through
        run: |
          if [ -z "$XILO_TOKEN" ]; then
            echo "::error::XILO_TOKEN is not set, so the build job cannot push what it builds and every later job would have to build it again; set it as an Actions secret, and as a Dependabot secret for Dependabot's pull requests"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          free-disk: ${{ matrix.free-disk }}
      - uses: stubbedev/xilo@b0f2295b1cb83fc46543f969b8c9991a78c37624 # v1.2.9
        with:
          url: https://nix.stubbe.dev
          cache: default/default
          token: ${{ secrets.XILO_TOKEN }}
      - id: store
        name: The store before the build
        run: ls /nix/store > "${RUNNER_TEMP}/store"
      - id: watch
        name: Push each path as the build finishes it
        run: |
          (
            xilo watch default/default > "${RUNNER_TEMP}/watch.log" 2>&1 &
            echo "$!" > "${RUNNER_TEMP}/watch.pid"
            status=0
            wait "$!" || status=$?
            echo "${status}" > "${RUNNER_TEMP}/watch.status"
          ) &
          until [ -s "${RUNNER_TEMP}/watch.pid" ]; do sleep 0.1; done
      - name: The entry's Nix outputs
        timeout-minutes: 6
        run: ${{ matrix.run }}
      - name: Push what the watch has not, also after the build failed or timed out
        if: always() && steps.store.outcome == 'success'
        timeout-minutes: 3
        run: |
          watch=0
          if [ "${{ steps.watch.outcome }}" = success ]; then
            kill -TERM "$(cat "${RUNNER_TEMP}/watch.pid")"
            until [ -s "${RUNNER_TEMP}/watch.status" ]; do sleep 1; done
            cat "${RUNNER_TEMP}/watch.log"
            watch=$(cat "${RUNNER_TEMP}/watch.status")
          fi
          just new-store-paths "${RUNNER_TEMP}/store" | xilo push default/default -
          if [ "${watch}" != 0 ]; then
            echo "::error::xilo watch exited ${watch} without pushing every path it saw; its log above names them"
            exit 1
          fi
