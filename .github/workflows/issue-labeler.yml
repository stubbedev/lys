# Reads the component dropdown from new issues and adds the matching component:* label.
#
# https://github.com/stefanbuck/github-issue-parser
# https://github.com/actions/github-script

name: Label Issues

on:
    issues:
        types: [opened, edited]

permissions:
    issues: write

jobs:
    label:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: stefanbuck/github-issue-parser@cb6e97157cbf851e3a393ff8d57c93a484cc323f # v3.2.5
              id: bug
              with:
                  template-path: .github/ISSUE_TEMPLATE/bug_report.yml

            - uses: stefanbuck/github-issue-parser@cb6e97157cbf851e3a393ff8d57c93a484cc323f # v3.2.5
              id: feature
              with:
                  template-path: .github/ISSUE_TEMPLATE/feature_request.yml

            - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  BUG_AREA: ${{ steps.bug.outputs.issueparser_area }}
                  FEATURE_AREA: ${{ steps.feature.outputs.issueparser_area }}
              with:
                  script: |
                      const area = process.env.BUG_AREA || process.env.FEATURE_AREA;
                      if (!area || area === 'Not sure') return;

                      const map = {
                          'Shell: bar, dropdowns, notifications, OSD, launcher': 'component:shell',
                          'Compositor (lys-wm)': 'component:wm',
                          'Login, greeter or lock screen (lys-login)': 'component:login',
                          'Settings app (lys-settings)': 'component:settings',
                          'Polkit agent (lys-polkit)': 'component:polkit',
                          'Battery and power profiles (lys-power)': 'component:power',
                          'Secret Service and vault (lys-secrets)': 'component:secrets',
                          'Boot splash (lys-splash)': 'component:splash',
                          'UI toolkit (lys-ui)': 'component:ui',
                          'Libraries (lys-lib, lys-desktop)': 'component:lib',
                          'Packages and install': 'component:packaging',
                          'Documentation': 'component:docs',
                      };

                      const label = map[area];
                      if (!label) return;

                      await github.rest.issues.addLabels({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          labels: [label],
                      });
